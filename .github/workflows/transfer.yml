name: GDrive to Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download from Google Drive
        run: |
          pip install gdown
          gdown --fuzzy 1AxvwcDgRm1zX7UVBojWRwZbBX7YMikXJ -O zju-ls-feng.zip

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 zju-ls-feng.zip --title "v1.0" --notes "AutoDL Transfer"
